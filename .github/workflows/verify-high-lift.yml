name: Verify high-lift service page

on:
  push:
    branches: [work/high-lift-service-page]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify responsive layouts and assessment flow
        run: |
          python tests/e2e/serve.py > /tmp/high-lift-preview.log 2>&1 &
          node tests/e2e/high-lift.cjs
      - name: Save responsive screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-lift-responsive-check
          path: qa/
          retention-days: 7
