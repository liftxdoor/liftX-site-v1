name: Optimize homepage mobile hero

on:
  push:
    branches:
      - agent/home-pagespeed-100-preview

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-pagespeed-100-preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Build mobile hero
        run: |
          python - <<'PY'
          from PIL import Image
          src = 'assets/projects/full-view-commercial-door-exterior-05.webp'
          dst = 'assets/projects/full-view-commercial-door-exterior-05-mobile.webp'
          with Image.open(src) as im:
              im = im.convert('RGB')
              width = 760
              height = round(im.height * width / im.width)
              im = im.resize((width, height), Image.Resampling.LANCZOS)
              im.save(dst, 'WEBP', quality=76, method=6)
              print('saved', dst, im.size)
          PY
      - name: Commit optimized asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/projects/full-view-commercial-door-exterior-05-mobile.webp
          if git diff --cached --quiet; then
            echo 'No asset changes.'
          else
            git commit -m 'Add optimized mobile homepage hero asset'
            git push origin HEAD:agent/home-pagespeed-100-preview
          fi
