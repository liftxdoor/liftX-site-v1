name: Optimize homepage mobile hero

on:
  push:
    branches:
      - agent/home-pagespeed-100-preview

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-pagespeed-100-preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Build mobile hero
        run: |
          python - <<'PY'
          from PIL import Image
          src = 'assets/projects/full-view-commercial-door-exterior-05.webp'
          dst = 'assets/projects/full-view-commercial-door-exterior-05-mobile.webp'
          with Image.open(src) as im:
              im = im.convert('RGB')
              width = 760
              height = round(im.height * width / im.width)
              im = im.resize((width, height), Image.Resampling.LANCZOS)
              im.save(dst, 'WEBP', quality=76, method=6)
              print('saved', dst, im.size)
          PY
      - name: Wire responsive hero delivery
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_preload = '<link rel="preload" as="image" href="/assets/projects/full-view-commercial-door-exterior-05.webp" fetchpriority="high">'
          new_preload = '<link rel="preload" as="image" href="/assets/projects/full-view-commercial-door-exterior-05-mobile.webp" media="(max-width: 760px)" fetchpriority="high">\n<link rel="preload" as="image" href="/assets/projects/full-view-commercial-door-exterior-05.webp" media="(min-width: 761px)" fetchpriority="high">'
          if old_preload in s:
              s = s.replace(old_preload, new_preload, 1)
          mobile_rule = '.home-hero{min-height:730px;background-position:58% center}'
          mobile_rule_new = '.home-hero{min-height:730px;background-image:url("/assets/projects/full-view-commercial-door-exterior-05-mobile.webp");background-position:58% center}'
          if mobile_rule in s:
              s = s.replace(mobile_rule, mobile_rule_new, 1)
          else:
              raise SystemExit('Expected mobile hero CSS rule not found')
          p.write_text(s)
          PY
      - name: Commit optimized asset and responsive wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/projects/full-view-commercial-door-exterior-05-mobile.webp
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Use optimized local hero asset on mobile preview'
            git push origin HEAD:agent/home-pagespeed-100-preview
          fi
