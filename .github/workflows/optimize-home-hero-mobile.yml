name: Optimize homepage mobile hero

on:
  push:
    branches:
      - agent/home-pagespeed-100-preview

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-pagespeed-100-preview
      - name: Remove final LCP blockers
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_img = 'loading="eager" fetchpriority="high" decoding="async"'
          new_img = 'loading="eager" fetchpriority="high" decoding="sync"'
          if old_img in s:
              s = s.replace(old_img, new_img, 1)
          elif new_img not in s:
              raise SystemExit('LCP image decoding target not found')

          external_script = '<script src="/site.js" defer></script>'
          js = Path('site.js').read_text().strip()
          inline_script = '<script>' + js + '</script>'
          if external_script in s:
              s = s.replace(external_script, inline_script, 1)
          elif inline_script not in s:
              raise SystemExit('site.js inline target not found')

          p.write_text(s)
          PY
      - name: Commit final LCP micro-optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Inline homepage navigation script for faster LCP'
            git push origin HEAD:agent/home-pagespeed-100-preview
          fi
