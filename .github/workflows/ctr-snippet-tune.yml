name: CTR snippet tune

on:
  push:
    branches:
      - agent/ctr-snippet-tune

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ctr-snippet-tune
      - name: Update search snippets
        run: |
          python - <<'PY'
          from pathlib import Path

          updates = {
              "index.html": [
                  ("<title>Boise Garage Door Company | LIFTX</title>", "<title>Garage Door Repair &amp; Installation Boise | LIFTX</title>"),
                  ('<meta name="description" content="Licensed, owner-operated LIFTX serves Boise and the Treasure Valley with residential, commercial, new construction, opener, replacement, and specialty door work.">', '<meta name="description" content="Owner-operated LIFTX provides garage door repair, installation, openers, replacement doors, and commercial door service across Boise and the Treasure Valley.">'),
                  ('<meta property="og:title" content="Boise Garage Door Company | LIFTX">', '<meta property="og:title" content="Garage Door Repair &amp; Installation Boise | LIFTX">'),
                  ('<meta property="og:description" content="Licensed, owner-operated LIFTX serves Boise and the Treasure Valley with residential, commercial, new construction, opener, replacement, and specialty door work.">', '<meta property="og:description" content="Owner-operated LIFTX provides garage door repair, installation, openers, replacement doors, and commercial door service across Boise and the Treasure Valley.">'),
              ],
              "garage-door-repair-boise.html": [
                  ("<title>Garage Door Repair Boise | Springs, Cables &amp; Openers | LIFTX</title>", "<title>Garage Door Repair Boise | Owner-Operated | LIFTX</title>"),
                  ('<meta content="Broken spring, off-track door, cable, roller, or opener trouble? Call or text LIFTX for garage door repair in Boise and across the Treasure Valley." name="description"/>', '<meta content="Broken spring, opener, cable, or off-track door? Call or text owner-operated LIFTX for garage door repair across Boise and the Treasure Valley." name="description"/>'),
                  ('<meta content="Garage Door Repair Boise | Springs, Cables &amp; Openers | LIFTX" property="og:title"/>', '<meta content="Garage Door Repair Boise | Owner-Operated | LIFTX" property="og:title"/>'),
                  ('<meta content="Broken spring, off-track door, cable, roller, or opener trouble? Call or text LIFTX for garage door repair in Boise and across the Treasure Valley." property="og:description"/>', '<meta content="Broken spring, opener, cable, or off-track door? Call or text owner-operated LIFTX for garage door repair across Boise and the Treasure Valley." property="og:description"/>'),
              ],
              "garage-door-installation-boise.html": [
                  ("<title>Garage Door Installation &amp; Replacement Boise | LIFTX</title>", "<title>Garage Door Installation Boise | New Doors | LIFTX</title>"),
                  ('<meta content="Garage door installation and replacement in Boise. Complete new door systems for homes, new construction, shops, commercial buildings, and Full-View projects." name="description"/>', '<meta content="New garage door installation and replacement for homes, shops, builders, and commercial properties across Boise and the Treasure Valley." name="description"/>'),
                  ('<meta content="Garage Door Installation &amp; Replacement Boise | LIFTX" name="twitter:title"/>', '<meta content="Garage Door Installation Boise | New Doors | LIFTX" name="twitter:title"/>'),
                  ('<meta content="Garage door installation and replacement in Boise. Complete new door systems for homes, new construction, shops, commercial buildings, and Full-View projects." name="twitter:description"/>', '<meta content="New garage door installation and replacement for homes, shops, builders, and commercial properties across Boise and the Treasure Valley." name="twitter:description"/>'),
                  ('<meta content="Garage Door Installation &amp; Replacement Boise | LIFTX" property="og:title"/>', '<meta content="Garage Door Installation Boise | New Doors | LIFTX" property="og:title"/>'),
                  ('<meta content="Garage door installation and replacement in Boise. Complete new door systems for homes, new construction, shops, commercial buildings, and Full-View projects." property="og:description"/>', '<meta content="New garage door installation and replacement for homes, shops, builders, and commercial properties across Boise and the Treasure Valley." property="og:description"/>'),
              ],
          }

          changed = False
          for filename, replacements in updates.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Expected snippet not found in {filename}: {old}")
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text)
                  changed = True

          if not changed:
              print("No changes needed")
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html garage-door-repair-boise.html garage-door-installation-boise.html
          git commit -m "Tune high-impression search snippets for CTR"
          git push origin HEAD:agent/ctr-snippet-tune
