name: Deploy LIFTX Cloudflare Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liftx-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy main to liftx-site-v1
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch commit
        uses: actions/checkout@v4

      - name: Record deployed GitHub commit
        run: git log -1 --format=%H

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run visualizer tests
        run: npm test

      - name: Deploy to existing Cloudflare production Worker
        run: npx --yes wrangler@4.128.0 deploy --name liftx-site-v1 --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
