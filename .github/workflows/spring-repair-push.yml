name: Spring repair SEO push

on:
  push:
    branches:
      - agent/spring-repair-push

permissions:
  contents: write

jobs:
  update-spring-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spring-repair-push

      - name: Add spring repair pricing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('garage-door-repair-boise.html')
          text = path.read_text()

          if 'Standard double-wide spring pair — $399 installed' in text:
              print('Pricing already present')
          else:
              needle = '<div class="section-head"><p class="eyebrow">Broken Spring Repair</p><h2>Garage door spring repair in Boise &amp; the Treasure Valley.</h2><p>Broken torsion and extension springs can leave a garage door heavy, stuck, or unsafe to operate. LIFTX provides spring diagnosis and replacement with correct spring sizing, matched-pair replacement on two-spring systems, door balancing, and complete system testing.</p></div>'
              insert = needle + '\n<div class="note" style="margin:28px 0"><strong style="display:block;font-size:1.35rem;margin-bottom:8px">Standard double-wide spring pair — $399 installed</strong><p style="margin:0 0 12px">For a standard residential double-wide, two-spring torsion system. Includes a matched pair of standard-cycle torsion springs, removal and installation, door balance and adjustment, and complete system safety testing.</p><p style="margin:0;color:var(--gray)"><strong>Quoted separately:</strong> oversized or specialty springs, high-cycle upgrades, spring conversions, damaged supporting hardware, commercial doors, and travel outside the standard service area. <a href="/warranty" style="color:var(--blue);font-weight:800">Warranty information →</a></p></div>'
              if needle not in text:
                  raise SystemExit('Spring section intro not found')
              path.write_text(text.replace(needle, insert, 1))
          PY

      - name: Commit spring pricing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garage-door-repair-boise.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add transparent spring repair pricing"
          git push origin HEAD:agent/spring-repair-push
