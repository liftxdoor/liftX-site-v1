name: One-time direct hero LCP image

on:
  push:
    branches:
      - agent/home-pagespeed-100-preview

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-pagespeed-100-preview
      - name: Convert CSS hero background to direct responsive image
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text()

          old_css = '.home-hero{min-height:690px;position:relative;color:#fff;background:url("/assets/projects/full-view-commercial-door-exterior-05.webp") 58% center/cover no-repeat;overflow:hidden}.home-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.96) 0%,rgba(0,0,0,.88) 29%,rgba(0,0,0,.46) 55%,rgba(0,0,0,.10) 80%,rgba(0,0,0,.03) 100%)}.home-hero-inner{position:relative;z-index:1;width:min(var(--max),calc(100% - (var(--gutter)*2)));margin:auto}'
          new_css = '.home-hero{min-height:690px;position:relative;color:#fff;background:#050607;overflow:hidden}.home-hero-media{position:absolute;inset:0;z-index:0;width:100%;height:100%;overflow:hidden}.home-hero-media picture{display:block;width:100%;height:100%}.home-hero-media img{display:block;width:100%;height:100%;max-width:none;object-fit:cover;object-position:58% center}.home-hero:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(0,0,0,.96) 0%,rgba(0,0,0,.88) 29%,rgba(0,0,0,.46) 55%,rgba(0,0,0,.10) 80%,rgba(0,0,0,.03) 100%)}.home-hero-inner{position:relative;z-index:2;width:min(var(--max),calc(100% - (var(--gutter)*2)));margin:auto}'
          if old_css not in s:
              raise SystemExit('Desktop hero CSS target not found')
          s = s.replace(old_css, new_css, 1)

          old_mobile = '.home-hero{min-height:730px;background-image:url("/assets/projects/full-view-commercial-door-exterior-05-mobile.webp");background-position:58% center}'
          new_mobile = '.home-hero{min-height:730px}.home-hero-media img{object-position:58% center}'
          if old_mobile not in s:
              raise SystemExit('Mobile hero CSS target not found')
          s = s.replace(old_mobile, new_mobile, 1)

          old_markup = '<section class="home-hero"><div class="home-hero-inner">'
          new_markup = '<section class="home-hero"><div class="home-hero-media" aria-hidden="true"><picture><source media="(max-width: 760px)" srcset="/assets/projects/full-view-commercial-door-exterior-05-mobile.webp"><img src="/assets/projects/full-view-commercial-door-exterior-05.webp" alt="" width="1350" height="1800" loading="eager" fetchpriority="high" decoding="async"></picture></div><div class="home-hero-inner">'
          if old_markup not in s:
              raise SystemExit('Hero markup target not found')
          s = s.replace(old_markup, new_markup, 1)

          path.write_text(s)
          PY
      - name: Commit one-time test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/one-time-lcp-picture.yml
          git commit -m 'Render homepage hero as direct responsive LCP image'
          git push origin HEAD:agent/home-pagespeed-100-preview
